<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fruit ledger</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<p id="status" class="status kit-caption" data-align="left">Connecting to vosu</p>
<section id="ledger" class="kit ledger" data-out data-orient="h" data-align="left" data-backing="scrim" data-motion="full" aria-label="Catch misses">
  <div class="cell cell-dmiss">
    <span class="kit-hero num" id="dmiss">—</span>
    <span class="kit-label">Droplets missed</span>
    <i class="flash" id="dmiss-flash"></i>
  </div>
  <div class="cell cell-breaks">
    <span class="kit-value num" id="breaks">—</span>
    <span class="kit-label">Combo breaks</span>
    <i class="flash" id="breaks-flash"></i>
  </div>
  <div class="hud" id="hud" hidden>
    <div class="stat"><span class="kit-value" id="fruits">—</span><span class="kit-label">Fruits</span></div>
    <div class="stat"><span class="kit-value" id="drops">—</span><span class="kit-label">Drops</span></div>
    <div class="stat"><span class="kit-value" id="droplets">—</span><span class="kit-label">Droplets</span></div>
    <div class="stat"><span class="kit-value"><span id="acc">—</span><span class="kit-unit tight">%</span></span><span class="kit-label">Accuracy</span></div>
    <div class="stat" id="best-stat"><span class="kit-value"><span id="best">—</span><span class="kit-unit tight">%</span></span><span class="kit-label">Best possible</span></div>
    <div class="stat"><span class="kit-value"><span id="combo">—</span><span class="kit-unit tight">×</span></span><span class="kit-label">Combo</span></div>
  </div>
</section>
<script type="module" src="overlay.js"></script>
</body>
</html>
