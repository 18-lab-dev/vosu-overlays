<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player tag</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="style.css">
<script type="module" src="overlay.js"></script>
</head>
<body>
<main id="stage" class="stage" data-orient="horizontal" data-align="right">
  <section id="tag" class="tag kit kit-enter" data-backing="scrim" data-motion="full" data-view="none" data-out aria-label="Player">
    <figure class="avatar" id="avatar" aria-hidden="true">
      <span class="monogram" id="monogram"></span>
      <img id="avatar-img" alt="" decoding="async" referrerpolicy="no-referrer" draggable="false" hidden>
    </figure>
    <div class="info" id="info">
      <p class="who" id="who"><span class="name kit-title" id="name"></span><span class="country kit-code" id="country" hidden></span></p>
      <p class="pp-line" id="pp-line"><span class="pp kit-value"><span id="pp"></span><span class="kit-unit" id="pp-unit">pp</span></span><span class="delta kit-label" id="d-pp" data-tone="flat"><span id="d-pp-text"></span></span></p>
    </div>
    <p class="rank-line" id="rank-line"><span class="rank kit-hero"><span class="hash" id="hash">#</span><span id="rank"></span><i class="gain" id="gain" aria-hidden="true"></i></span><span class="delta kit-label" id="d-rank" data-tone="flat"><i class="tri" aria-hidden="true"></i><span id="d-rank-text"></span></span></p>
    <p class="status kit-caption" id="status" role="status"></p>
  </section>
</main>
</body>
</html>
