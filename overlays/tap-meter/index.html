<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tap meter · 18-LAB</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <section id="meter" class="cluster" aria-label="Tap meter" data-view="chip" data-zone="right" data-backing="none">
    <header class="tag">
      <span class="brand" id="brand">18—LAB</span>
      <span class="status" id="status" data-state="connecting"><i class="dot"></i><span id="status-text">Connecting</span></span>
    </header>

    <div class="hero" id="live">
      <span class="label">Stream <span class="unit">bpm</span></span>
      <b class="figure" id="bpm">—</b>
      <span class="sub" id="interval"></span>
    </div>

    <div class="trace">
      <canvas id="comb" aria-label="Recent tap intervals: K1 above the axis, K2 below; bar height is stream speed"></canvas>
      <p class="notice" id="notice" hidden></p>
      <span class="axis k1">K1</span>
      <span class="axis k2">K2</span>
    </div>

    <dl class="stats">
      <div class="peak"><dt>Peak</dt><dd><b id="peak">—</b><span class="unit">bpm</span></dd></div>
      <div class="sigma"><dt>Interval <span class="sym">σ</span></dt><dd><b id="sigma">—</b><span class="unit">ms</span></dd></div>
      <div class="alt"><dt>Alternate</dt><dd><b id="alt">—</b><span class="unit">%</span></dd></div>
    </dl>

    <div class="balance" id="balance-row">
      <span class="key">K1</span><b id="k1">—</b>
      <i class="split"><i id="split"></i></i>
      <b id="k2">—</b><span class="key">K2</span>
    </div>

    <dl class="judgements" id="judgements">
      <div class="j100"><dt>100</dt><dd id="h100">—</dd></div>
      <div class="j50"><dt>50</dt><dd id="h50">—</dd></div>
      <div class="jmiss"><dt>Miss</dt><dd id="h0">—</dd></div>
      <div class="jsb"><dt>SB</dt><dd id="hsb">—</dd></div>
    </dl>
  </section>
</div>
<script type="module" src="overlay.js"></script>
</body>
</html>
