<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Judgement ratio · 18-LAB</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-align="left">
<section id="hud" class="kit jr kit-enter" aria-label="osu!mania judgements" data-out data-orient="vertical" data-align="left" data-phase="live" data-hud="false" data-kps="false" data-backing="scrim" data-motion="full">
  <div class="hero">
    <span class="kit-label">Ratio:</span>
    <ol class="chain" id="chain" data-known="false" aria-label="MAX : 300 : 200 : 100 : 50 : Miss">
      <li class="term" data-j="max"><span class="kit-label name">MAX</span><b class="kit-hero value">—</b></li>
      <li class="colon" aria-hidden="true">:</li>
      <li class="term" data-j="great"><span class="kit-label name">300</span><b class="kit-hero value">—</b></li>
      <li class="colon" aria-hidden="true">:</li>
      <li class="term" data-j="good"><span class="kit-label name">200</span><b class="kit-hero value">—</b></li>
      <li class="colon" aria-hidden="true">:</li>
      <li class="term" data-j="ok"><span class="kit-label name">100</span><b class="kit-hero value">—</b></li>
      <li class="colon" aria-hidden="true">:</li>
      <li class="term" data-j="meh"><span class="kit-label name">50</span><b class="kit-hero value">—</b></li>
      <li class="colon" aria-hidden="true">:</li>
      <li class="term" data-j="miss"><span class="kit-label name">Miss</span><b class="kit-hero value">—</b></li>
    </ol>
    <b class="kit-hero value probe" id="probe" aria-hidden="true"></b>
  </div>
  <canvas id="bar" class="bar" aria-hidden="true"></canvas>
  <ol class="counts">
    <li class="cell" data-j="max"><span class="kit-label">MAX</span><span class="kit-value count"><b>—</b></span></li>
    <li class="cell" data-j="great"><span class="kit-label">300</span><span class="kit-value count"><b>—</b></span></li>
    <li class="cell" data-j="good"><span class="kit-label">200</span><span class="kit-value count"><b>—</b></span></li>
    <li class="cell" data-j="ok"><span class="kit-label">100</span><span class="kit-value count"><b>—</b></span></li>
    <li class="cell" data-j="meh"><span class="kit-label">50</span><span class="kit-value count"><b>—</b><b class="flash" aria-hidden="true"></b></span></li>
    <li class="cell" data-j="miss"><span class="kit-label">Miss</span><span class="kit-value count"><b>—</b><b class="flash" aria-hidden="true"></b></span></li>
  </ol>
  <div class="stats">
    <div class="stat acc"><span class="kit-label">Accuracy</span><span class="kit-value"><b id="acc">—</b><span class="kit-unit tight">%</span></span></div>
    <div class="stat combo"><span class="kit-label">Combo</span><span class="kit-value"><b id="combo">—</b><span class="kit-unit tight">×</span></span></div>
    <div class="stat kps"><span class="kit-label">Keys per second</span><span class="kit-value"><b id="kps">—</b><span class="kit-unit">kps</span></span></div>
    <div class="stat peak"><span class="kit-label">Peak</span><span class="kit-value"><b id="peak">—</b><span class="kit-unit">kps</span></span></div>
  </div>
  <p class="kit-caption note" id="note" hidden>Keys per second needs vosu's <span class="kit-code">ENABLE_KEY_OVERLAY</span></p>
</section>
<p id="chip" class="kit-caption chip" role="status" data-shown="false">Connecting to vosu</p>
<script type="module" src="overlay.js"></script>
</body>
</html>
