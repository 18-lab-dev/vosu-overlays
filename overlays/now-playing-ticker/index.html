<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Now playing ticker · 18-LAB</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="style.css">
<script type="module" src="overlay.js"></script>
</head>
<body>
<div id="root" data-layout="line" data-align="center" data-show="on">
  <div id="panel" class="kit" data-kind="status" data-backing="scrim" data-motion="full" data-map-tint="on" role="status" aria-label="Now playing">
    <div class="roll">
      <span class="status kit-caption" id="status">Connecting</span>
      <span class="vp"><span class="track"><span class="artist kit-text"></span><span class="sep kit-text">—</span><span class="title kit-title">—</span><span class="suffix kit-title"></span><span class="ver kit-text"></span></span></span>
      <span class="meta">
        <span class="seg stars"><span class="kit-value"><span class="num">—</span><span class="kit-unit tight">★</span></span></span>
        <span class="seg mods"><span class="kit-code codes"></span><span class="kit-text rate"><span class="num"></span><span class="kit-unit tight">×</span></span></span>
        <span class="seg mapper"><span class="kit-caption by">mapped by</span><span class="kit-text name"></span></span>
      </span>
    </div>
    <div class="prog" aria-hidden="true"><i></i></div>
  </div>
</div>
</body>
</html>
