<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Key overlay</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="block" class="block" data-orient="v" data-caps="end" data-show="0" data-instant aria-label="Key overlay">
  <div class="read" id="read">
    <b class="num" id="kps">—</b><span class="label">KPS</span>
    <span class="label peak-label">Peak</span><b class="num small" id="peak">—</b>
  </div>
  <div class="tape">
    <canvas id="tape" aria-label="Key presses scrolling away from the key caps"></canvas>
    <p class="note" id="note" hidden></p>
  </div>
  <div class="caps" id="caps"></div>
</section>
<div class="chip" id="chip" data-state="connecting"><i></i><span id="chip-text">Connecting</span></div>
<script type="module" src="overlay.js"></script>
</body>
</html>
