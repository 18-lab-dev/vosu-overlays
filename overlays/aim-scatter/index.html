<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aim scatter</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="style.css">
<script type="module" src="overlay.js"></script>
</head>
<body>
<main id="aim" class="aim kit kit-enter" data-view="chip" data-out data-orient="vertical" data-align="center" data-backing="scrim" data-motion="full" data-map-tint="on" aria-label="Aim scatter">
  <div class="plot" id="plot">
    <div class="target" id="target">
      <canvas id="reticle" aria-hidden="true"></canvas>
      <canvas id="trail" aria-hidden="true"></canvas>
      <canvas id="recent" aria-hidden="true"></canvas>
      <canvas id="stats" role="img" aria-label="Cursor offset from each hit circle's centre, with the average offset as an arrow"></canvas>
      <i class="hit" id="hit" aria-hidden="true" hidden><i class="hit__ring" id="hit-ring"></i></i>
    </div>
    <p class="bias" id="bias-row">
      <span class="kit-label bias__label">Aim bias</span>
      <span class="kit-value bias__value"><svg id="bias-arrow" class="bias__arrow" viewBox="0 0 16 16" aria-hidden="true" hidden><path d="M2.5 8h10M8.5 3.5 13 8l-4.5 4.5"/></svg><span id="bias" class="kit-dash">—</span><span class="kit-unit">px</span></span>
    </p>
  </div>
  <p class="kit-text notice" id="notice"><span class="notice__long">Set <span class="kit-code">ENABLE_HIT_OFFSETS</span> to true in vosu</span><span class="notice__short">Hit offsets are off in vosu</span></p>
  <p class="kit-caption status" id="status">Connecting</p>
</main>
</body>
</html>
