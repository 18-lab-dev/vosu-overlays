<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player card · 18-LAB</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="style.css">
<script type="module" src="overlay.js"></script>
</head>
<body>
<div id="stage">
  <article id="card" class="card" data-layout="horizontal" data-conn="connecting" aria-label="Player card">
    <header class="head">
      <span class="brand" id="brand">18—LAB<span>Player</span></span>
      <span class="ruleset" id="ruleset"></span>
      <span class="status" id="status" data-tone="wait"><i class="dot" aria-hidden="true"></i><span id="status-text">Connecting</span></span>
    </header>
    <div class="body">
      <figure class="avatar" id="avatar" aria-hidden="true">
        <span class="monogram" id="monogram"></span>
        <img id="avatar-img" alt="" decoding="async" referrerpolicy="no-referrer" draggable="false" hidden>
      </figure>
      <div class="ident">
        <h1 class="name" id="name" data-empty>—</h1>
        <span class="country" id="country" hidden></span>
      </div>
      <dl class="stats">
        <div class="stat stat--rank"><dt>Global</dt><dd><span class="v" id="rank" data-empty>—</span><span class="d" id="d-rank"></span></dd></div>
        <div class="stat"><dt>pp</dt><dd><span class="v" id="pp" data-empty>—</span><span class="d" id="d-pp"></span></dd></div>
        <div class="stat"><dt>Accuracy</dt><dd><span class="v" id="acc" data-empty>—</span><span class="d"></span></dd></div>
        <div class="stat"><dt>Plays</dt><dd><span class="v" id="plays" data-empty>—</span><span class="d" id="d-plays"></span></dd></div>
      </dl>
    </div>
    <footer class="level">
      <span class="level__label">Lv <b id="level" data-empty>—</b></span>
      <span class="level__track" id="level-track" data-empty><span class="level__fill" id="level-fill"></span><span class="level__head" id="level-head"><i></i></span></span>
      <span class="level__pct" id="level-pct">—</span>
    </footer>
  </article>
</div>
</body>
</html>
