<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Combo HUD · 18-LAB</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="stage" data-layout="hud" data-backing="none" data-accent="map" aria-label="Gameplay HUD">
  <div class="group" id="group"></div>

  <section class="cluster cluster--combo" id="combo-cell" aria-label="Combo">
    <div class="cluster__top">
      <span class="labels"><span class="label label--main" id="combo-label">Combo</span><span class="label label--break" id="break-label" aria-hidden="true">Break</span></span>
      <span class="label peak" id="peak">Peak <b id="peak-value">—</b></span>
    </div>
    <div class="combo">
      <span class="combo__value" id="combo"><span id="combo-num">—</span><span class="combo__unit">×</span></span>
      <span class="combo__ghost" id="ghost" aria-hidden="true"><span id="ghost-num"></span><span class="combo__unit">×</span></span>
    </div>
    <div class="rail" id="rail" aria-hidden="true"><i class="rail__fill" id="rail-fill"></i><i class="rail__peak" id="rail-peak"></i><i class="rail__break" id="rail-break"></i></div>
  </section>

  <section class="cluster cluster--score" id="score-cluster" aria-label="Score and accuracy">
    <div class="score" id="score-cell"><span class="score__lead" id="score-lead"></span><span id="score">—</span></div>
    <div class="acc-row">
      <span class="prog" id="prog-cell"><span class="prog__time" id="time">—</span><canvas class="ring" id="ring" aria-hidden="true"></canvas></span>
      <span class="rank" id="rank" hidden></span>
      <span class="acc" id="acc-cell"><span id="acc">—</span><span class="acc__unit">%</span></span>
    </div>
    <div class="brand"><span class="brand__tag" id="source" hidden></span><b id="brand">18—LAB</b></div>
  </section>

  <section class="cluster cluster--hp" id="hp-cell" aria-label="Health">
    <span class="label">HP</span>
    <span class="meter"><i class="meter__fill" id="hp-fill"></i></span>
    <span class="hp__value" id="hp">—</span>
  </section>

  <div class="status" id="status" data-state="connecting" role="status"><i></i><span id="status-text">Connecting to vosu</span></div>
</main>
<script type="module" src="overlay.js"></script>
</body>
</html>
