<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catcher trail</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="style.css">
<script type="module" src="overlay.js"></script>
</head>
<body>
<main id="root" class="kit" data-view="connecting" data-orient="vertical" data-align="left" data-backing="scrim" data-motion="full" data-map-tint="on" aria-label="Catcher trail">
  <header class="head" id="dash-row">
    <p class="dash"><span class="scope"><span class="kit-label">Dash share</span><span class="kit-caption">this attempt</span></span><span class="kit-value"><span id="dash" class="kit-dash">—</span><span class="kit-unit tight">%</span></span></p>
  </header>
  <div class="plot"><canvas id="trace" aria-label="Catcher position over the last seconds, one tick per second: dashes in amber, misses in red"></canvas></div>
  <dl class="final" id="final">
    <div><dt class="kit-label">Dash share</dt><dd class="kit-value"><span id="final-dash" class="kit-dash">—</span><span class="kit-unit tight">%</span></dd></div>
    <div><dt class="kit-label">Direction changes</dt><dd class="kit-value"><span id="final-turns" class="kit-dash">—</span></dd></div>
  </dl>
  <p class="note kit-text">Catcher position needs vosu</p>
  <p class="chip kit-caption" id="chip" role="status">Connecting</p>
</main>
</body>
</html>
