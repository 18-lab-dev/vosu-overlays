<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taiko pace · 18-LAB</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage" data-view="chip" data-backing="none">
  <!-- Gameplay: under the lane. Also hosts the status chip. -->
  <div class="spot" id="playSpot">
    <p class="chip" id="chip" role="status"><i></i><span id="chipText">Connecting</span></p>
    <section class="block pace" aria-label="osu!taiko accuracy pace">
      <header class="head">
        <b class="brand">18—LAB</b>
        <span class="lbl">Target</span><b class="target" data-target>99.00%</b>
      </header>
      <div class="hero">
        <div class="readout">
          <span class="lbl">Accuracy</span>
          <span class="big"><span id="acc">—</span><small>%</small></span>
          <span class="sub"><span class="lbl">Max</span><b id="max">—</b></span>
        </div>
        <div class="readout end" id="budget">
          <span class="lbl" id="budgetLabel">OK budget</span>
          <span class="big hl"><span id="okBudget">—</span><small id="budgetUnit"></small></span>
          <span class="sub"><span class="lbl" id="missLabel">Miss budget</span><b id="missBudget">—</b></span>
        </div>
      </div>
      <canvas id="tape" aria-hidden="true"></canvas>
      <div class="row">
        <span class="cell great"><span class="lbl"><i></i>Great</span><b id="great">—</b></span>
        <span class="cell ok"><span class="lbl"><i></i>OK</span><b id="ok">—</b></span>
        <span class="cell miss"><span class="lbl"><i></i>Miss</span><b id="miss">—</b></span>
        <span class="cell rest"><span class="lbl"><i></i>Left</span><b id="remaining">—</b></span>
        <span class="cell end" data-ur><span class="lbl">UR</span><b id="ur">—</b></span>
        <span class="cell end" data-pp><span class="lbl">PP</span><b id="pp">—</b></span>
        <span class="cell end" data-pp><span class="lbl">FC</span><b id="fc">—</b></span>
      </div>
    </section>
  </div>
  <!-- Song select: the budget for the selected map, in the centre column. -->
  <div class="spot" id="preSpot">
    <section class="block pre" aria-label="Accuracy budget for the selected map">
      <header class="head">
        <b class="brand">18—LAB</b>
        <span class="lbl">Taiko pace</span>
        <span class="lbl">Target</span><b class="target" data-target>99.00%</b>
      </header>
      <div class="hero">
        <div class="readout"><span class="lbl">OK budget</span><span class="big hl"><span id="preOk">—</span></span></div>
        <div class="readout"><span class="lbl">Miss budget</span><span class="big"><span id="preMiss">—</span></span></div>
        <div class="readout end"><span class="lbl">Notes</span><span class="big dim"><span id="preNotes">—</span></span></div>
      </div>
      <p class="facts">
        <span class="fact"><span class="lbl">Great window</span><b id="preWindow">—</b></span>
        <span class="fact" data-pp><span class="lbl">PP at target</span><b id="prePp">—</b></span>
        <span class="fact" data-pp><span class="lbl">SS</span><b id="preSs">—</b></span>
      </p>
    </section>
  </div>
  <!-- Results: verdict against the target, UR and pp, in the header strip. -->
  <div class="spot" id="postSpot">
    <section class="block post" aria-label="Result against the target accuracy">
      <span class="cell end" id="verdict"><span class="lbl"><span id="verdictLabel">Vs target</span> <b data-target>99.00%</b></span><b id="delta">—</b></span>
      <span class="cell end" data-ur><span class="lbl">UR</span><b id="postUr">—</b></span>
      <span class="cell end" data-pp><span class="lbl">PP</span><b id="postPp">—</b></span>
      <span class="cell end" data-pp><span class="lbl">FC</span><b id="postFc">—</b></span>
    </section>
  </div>
</div>
<script type="module" src="overlay.js"></script>
</body>
</html>
