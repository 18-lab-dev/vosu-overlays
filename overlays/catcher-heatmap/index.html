<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catcher heatmap · 18-LAB</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="style.css">
<script type="module" src="overlay.js"></script>
</head>
<body>
<div id="stage">
  <div id="zone" class="zone">
    <section id="hud" class="hud" aria-label="Catcher position heatmap" data-view="hidden">
      <header class="head">
        <span class="brand" id="brand">18—LAB</span>
        <span class="title">Catcher heatmap</span>
        <span class="spacer"></span>
        <span class="clock" id="clock"></span>
        <span class="tag" id="tag">Result</span>
        <span class="dash" id="dash">Dash</span>
      </header>
      <div class="field">
        <canvas id="plot" aria-label="Time spent at each playfield position, with the live catcher and centre of gravity"></canvas>
        <div class="axis" aria-hidden="true">
          <span style="left:0%">0</span><span style="left:25%">128</span><span style="left:50%">256</span><span style="left:75%">384</span><span style="left:100%">512</span>
        </div>
      </div>
      <div class="stats">
        <div class="cell">
          <span class="label"><i class="glyph-cg"></i>Centre</span>
          <span class="read"><b id="cog">—</b><em id="cogSide"></em></span>
        </div>
        <div class="cell">
          <span class="label">Spread <span class="sym">σ</span></span>
          <span class="read"><b id="spread">—</b><small>px</small></span>
        </div>
        <div class="cell">
          <span class="label">Dash</span>
          <span class="read"><b id="dashShare">—</b><small>%</small></span>
        </div>
        <div class="cell">
          <span class="label">L · R</span>
          <span class="read split"><b id="left">—</b><i class="divider"></i><b id="right">—</b></span>
        </div>
      </div>
    </section>
    <p id="status" class="status" data-state="connecting"><i></i><span id="statusText">connecting</span></p>
  </div>
</div>
</body>
</html>
