<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Session tracker · 18-LAB</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <!-- Song select: the session ledger osu! has nowhere on screen. -->
  <section id="ledger" class="cluster" aria-label="Session stats" hidden>
    <header class="head">
      <span class="lbl hl">Session</span>
      <span class="clock" id="clock">0m</span>
      <span class="brand" id="brand">18—LAB</span>
    </header>

    <div class="row readouts" id="rowPlays">
      <div class="r"><b class="num" id="plays">0</b><span class="lbl">Plays</span></div>
      <div class="r"><b class="num"><span id="ptH" hidden>0</span><small id="ptHu" hidden>h</small><span id="ptM">0</span><small>m</small></b><span class="lbl">Play time</span></div>
      <div class="r"><b class="num"><span id="rate">—</span><small id="rateU" hidden>%</small></b><span class="lbl">Pass</span></div>
    </div>

    <div class="row" id="rowTape">
      <div class="tapebox"><canvas id="tape" aria-hidden="true"></canvas><span class="empty" id="tapeEmpty">No attempts yet</span></div>
      <div class="legend">
        <span class="key pass"><i aria-hidden="true"></i>Pass<b id="nPass">0</b></span>
        <span class="key fail"><i aria-hidden="true"></i>Fail<b id="nFail">0</b></span>
        <span class="key retry"><i aria-hidden="true"></i>Retry<b id="nRetry">0</b></span>
      </div>
    </div>

    <div class="row line" id="rowBest">
      <span class="lbl">Best</span>
      <span class="val"><b class="num" id="best">—</b><small id="bestU" hidden>pp</small></span>
      <span class="g" id="bestGrade"></span>
      <span class="aux" id="bestAcc"></span>
      <em class="new hl" id="newBest">New</em>
      <span class="map" id="bestMap"></span>
    </div>

    <div class="row line" id="rowAccuracy">
      <span class="lbl">Avg acc</span>
      <span class="val"><b class="num" id="acc">—</b><small id="accU" hidden>%</small></span>
      <span class="aux" id="accSub"></span>
    </div>

    <div class="row grades" id="rowGrades" aria-label="Grades">
      <span data-g="SS"><i>SS</i><b id="gSS">0</b></span>
      <span data-g="S"><i>S</i><b id="gS">0</b></span>
      <span data-g="A"><i>A</i><b id="gA">0</b></span>
      <span data-g="B"><i>B</i><b id="gB">0</b></span>
      <span data-g="C"><i>C</i><b id="gC">0</b></span>
      <span data-g="D"><i>D</i><b id="gD">0</b></span>
    </div>

    <div class="row line" id="rowProfile">
      <span class="lbl">Since start</span>
      <span class="delta" id="ppDelta"></span>
      <span class="delta" id="rankDelta"></span>
    </div>
  </section>

  <!-- Gameplay: a minimal attempt counter beside the playfield. -->
  <section id="mini" class="cluster mini" aria-label="Session attempt" hidden>
    <div class="mtop">
      <span class="lbl" id="miniLbl">Attempt</span>
      <b class="num" id="miniNum">1</b>
      <span class="clock" id="miniClock">0m</span>
    </div>
    <canvas id="miniTape" aria-hidden="true"></canvas>
    <div class="mline">
      <span><b id="mPass">0</b> pass</span>
      <span><b id="mFail">0</b> fail</span>
      <span><b id="mRetry">0</b> retry</span>
    </div>
  </section>

  <!-- Results: one line of session context in the free right part of the header strip. -->
  <section id="result" class="cluster rline" aria-label="Session after this play" hidden>
    <span class="lbl hl">Session</span>
    <span><b class="num" id="rPlays">0</b><small>plays</small></span>
    <span><b class="num" id="rPass">0</b><small>pass</small></span>
    <span id="rBestBox"><small>best</small><b class="num" id="rBest">—</b><small>pp</small><em class="new hl" id="rNew">New</em></span>
    <span class="delta" id="rDelta"></span>
  </section>

  <span class="chip" id="chip" hidden><i aria-hidden="true"></i><span id="chipText">Connecting</span></span>
</div>
<script type="module" src="overlay.js"></script>
</body>
</html>
