<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hit error arc · 18-LAB</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <section id="panel" class="panel" aria-label="Hit error arc" data-shown="false">
    <canvas id="base" aria-hidden="true"></canvas>
    <canvas id="hist" aria-hidden="true"></canvas>
    <canvas id="live" aria-label="Hit error dial: recent hits, judgement windows and moving average"></canvas>
    <header class="corner corner--left"><span id="brand" class="brand">18—LAB</span></header>
    <header class="corner corner--right"><span id="live-dot" class="live-dot" aria-hidden="true"></span><span id="mode">—</span></header>
    <div id="readout" class="readout">
      <span class="label">UR</span>
      <span class="ur"><span id="ur-int">—</span><span id="ur-frac" class="ur__frac"></span></span>
    </div>
    <footer id="foot" class="foot">
      <span class="label label--early">Early</span>
      <span class="mean"><span class="label">Mean</span><span id="mean">—</span><span class="unit">ms</span></span>
      <span class="label label--late">Late</span>
    </footer>
  </section>
  <div id="chip" class="chip" role="status" data-shown="true"><span id="chip-dot" class="chip__dot"></span><span id="chip-text">Connecting to vosu</span></div>
</div>
<script type="module" src="overlay.js"></script>
</body>
</html>
