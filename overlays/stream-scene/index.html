<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stream scene · 18-LAB</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage" data-backing="scrim" data-phase="none" data-accent="map">
  <div id="cam-group" class="cam-group">
    <div id="cam" class="cam" aria-label="Webcam">
      <i class="tk tl"></i><i class="tk tr"></i><i class="tk bl"></i><i class="tk br"></i>
      <span class="guide" id="cam-guide"></span>
    </div>
    <div id="info" class="info soft">
      <div id="caption" class="caption">
        <span class="mark" aria-hidden="true"></span>
        <span id="handle" class="handle"></span>
        <span id="social" class="social"></span>
      </div>
      <p id="status-line" class="status"><span id="dot" class="dot" data-status="connecting"></span><span id="status-text">Connecting</span></p>
    </div>
  </div>

  <section id="strip" class="strip soft" aria-label="Live play">
    <header class="np">
      <b id="brand" class="brand">18—LAB</b>
      <span id="np-title" class="np-title"></span>
      <span id="np-time" class="np-time"></span>
    </header>
    <div id="progress" class="progress"><i id="np-fill"></i></div>
    <div class="readouts">
      <div class="r r-pp"><span class="k">PP</span><span class="v"><b id="pp-now">—</b><small>pp</small></span><span class="s">if FC <b id="pp-fc">—</b></span></div>
      <div class="r r-mods"><span class="k">Mods</span><span class="mods" id="mods"></span><span class="s" id="rate"></span></div>
      <div class="r r-acc"><span class="k">Acc</span><span class="v"><b id="acc">—</b><small>%</small></span></div>
      <div class="r r-combo"><span class="k">Combo</span><span class="v"><b id="combo">—</b><small>×</small></span></div>
      <div class="r r-ur"><span class="k" id="ur-k">UR</span><span class="v"><b id="ur">—</b></span></div>
    </div>
  </section>

  <section id="ledger" class="ledger soft" aria-label="Session">
    <div id="result-cell" class="lg lg-result">
      <span class="k">PP</span><span class="v"><b id="r-pp" class="hl">—</b><small>pp</small></span><span class="s">if FC <b id="r-fc">—</b></span>
    </div>
    <div class="lg lg-session"><span class="k">Session</span><span class="v"><b id="s-plays">—</b><small>plays</small></span><span class="s">playtime <b id="s-time">—</b></span></div>
    <div class="lg lg-session"><span class="k">PP gained</span><span class="v"><b id="s-pp" class="delta">—</b></span><span class="s">this session</span></div>
    <div class="lg lg-session"><span class="k">Rank</span><span class="v"><b id="s-rank" class="delta">—</b></span><span class="s" id="s-rank-now"></span></div>
  </section>
</div>
<script type="module" src="overlay.js"></script>
</body>
</html>
