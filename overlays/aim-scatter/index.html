<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aim scatter</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
<script type="module" src="overlay.js"></script>
</head>
<body>
<main id="aim" class="aim" data-view="none" data-orient="vertical" data-align="center" data-backing="none" aria-label="Aim scatter">
  <header class="head" id="head">
    <span class="title">Aim</span>
    <span class="status" id="status" data-tone="busy"><i class="dot" aria-hidden="true"></i><span id="status-text">Connecting</span></span>
  </header>
  <div class="target" id="target">
    <canvas id="reticle" aria-hidden="true"></canvas>
    <canvas id="trail" aria-hidden="true"></canvas>
    <canvas id="live" role="img" aria-label="Cursor offset from each hit circle's centre"></canvas>
  </div>
  <p class="notice" id="notice">Set <b>ENABLE_HIT_OFFSETS</b> = true in vosu</p>
  <div class="legend" id="legend" aria-label="Dot colour is timing error">
    <span class="legend__early">Early</span>
    <i class="legend__ramp" aria-hidden="true"></i>
    <span class="legend__late">Late</span>
    <span class="legend__window" id="window">± — ms</span>
  </div>
  <dl class="readouts" id="readouts">
    <div class="readout">
      <dt>Bias</dt>
      <dd><b id="bias">—</b><small>px</small></dd>
      <dd class="readout__sub"><svg id="bias-arrow" class="arrow" viewBox="0 0 10 10" aria-hidden="true" hidden><path d="M1.5 5h6.5M5.4 2.4 8 5 5.4 7.6"/></svg><span id="bias-dir"></span></dd>
    </div>
    <div class="readout">
      <dt>Centre</dt>
      <dd><b id="centre">—</b><small>%</small></dd>
      <dd class="readout__sub" id="centre-sub"></dd>
    </div>
    <div class="readout">
      <dt>Spread<span class="long"> 1<span class="lc">σ</span></span></dt>
      <dd><b id="spread">—</b><small>px</small></dd>
      <dd class="readout__sub" id="spread-sub"></dd>
    </div>
  </dl>
</main>
</body>
</html>
