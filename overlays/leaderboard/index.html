<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leaderboard</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="root" class="root vertical">
  <p id="chip" class="chip" role="status" hidden><i></i><span id="chip-text">Connecting to vosu</span></p>
  <section id="board" class="board" aria-label="Leaderboard">
    <header class="head">
      <span class="rank"><b id="board-pos">—</b><span id="board-total"></span></span>
      <span id="board-gap" class="hgap"><b></b><span></span></span>
    </header>
    <div id="board-rows" class="rows"><div id="skip" class="skip out"><span></span></div></div>
  </section>
  <section id="rival" class="rival" aria-label="Leaderboard rivals">
    <div class="rlabel"><i></i>Leaderboard</div>
    <div class="ladder">
      <div id="rival-rows" class="rrows"></div>
      <div class="you"><b id="rival-pos" class="rpos"></b><span id="rival-total" class="rtotal"></span><span id="rival-delta" class="delta"></span></div>
    </div>
  </section>
</div>
<template id="rival-template"><div class="rrow out"><span class="rk" data-r="pos"></span><span class="rn" data-r="name"></span><span class="rg" data-r="gap"></span></div></template>
<template id="board-template"><div class="row out"><div class="tint"></div><div class="flash" data-r="flash"></div><span class="pos" data-r="pos"></span><span class="who"><span class="name" data-r="name"></span><span class="delta" data-r="delta"></span></span><span class="score" data-r="score"></span><span class="meta"><span class="fail">Failed</span><span class="acc" data-r="acc"></span><span class="combo" data-r="combo"></span><span class="mods" data-r="mods"></span></span></div></template>
<script type="module" src="overlay.js"></script>
</body>
</html>
