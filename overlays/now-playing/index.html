<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Now playing · 18-LAB</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<p class="chip kit-caption" id="chip" hidden data-f="chip"></p>
<section class="kit kit-enter" id="np" data-out data-orient="vertical" data-align="end" data-layout="full" data-backing="scrim" data-motion="full" data-map-tint="on" aria-label="Now playing">
  <div class="body" id="body">
    <div class="ident" id="ident">
      <h1 class="title kit-title" id="title"><span data-f="title"></span><span class="joined kit-text" aria-hidden="true"><span class="sep"> · </span><span data-f="artistJoined"></span></span></h1>
      <p class="meta kit-text"><span class="artist" id="artistLine"><span data-f="artist"></span><span class="suffix" id="suffixWrap"> <span data-f="suffix"></span></span></span><span class="sep" aria-hidden="true"> · </span><span class="diffline"><span class="diff" data-f="version"></span><span class="mapper" id="mapperWrap"><span class="by"> by </span><span data-f="mapper"></span></span></span></p>
    </div>
    <div class="prog" id="prog" aria-hidden="true"><div class="track"><i class="fill kit-ambient" id="bar"></i></div></div>
    <div class="nums">
      <p class="hero kit-hero" aria-label="Star rating"><span data-f="stars">—</span><span class="kit-unit tight star">★<span class="strain" id="strain" hidden><i id="strainFill"></i></span></span></p>
      <div class="side">
        <p class="mods kit-code" data-f="mods"></p>
        <p class="bpm kit-value"><span id="bpmNum"><span data-f="bpm">—</span></span><span class="kit-unit">bpm</span></p>
      </div>
      <dl class="stats" id="stats">
        <div class="cell" data-k="ar"><dt class="kit-label">AR</dt><dd class="v"><span class="to">—</span><span class="adj"></span></dd></div>
        <div class="cell" data-k="cs"><dt class="kit-label">CS</dt><dd class="v"><span class="to">—</span><span class="adj"></span></dd></div>
        <div class="cell" data-k="od"><dt class="kit-label">OD</dt><dd class="v"><span class="to">—</span><span class="adj"></span></dd></div>
        <div class="cell" data-k="hp"><dt class="kit-label">HP</dt><dd class="v"><span class="to">—</span><span class="adj"></span></dd></div>
      </dl>
    </div>
  </div>
</section>
<script type="module" src="overlay.js"></script>
</body>
</html>
