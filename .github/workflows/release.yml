name: Overlay release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test*.py'
      - name: Build overlay packages and catalog
        run: python scripts/package.py --base-url "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}"
      - uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: dist/*
