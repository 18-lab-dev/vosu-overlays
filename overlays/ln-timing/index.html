<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LN timing · 18-LAB</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <section id="panel" class="panel" data-view="offline" aria-label="Long note press and release timing">
    <header class="head">
      <span class="brand" id="brand">18—LAB</span>
      <span class="label">LN timing</span>
      <span class="spacer"></span>
      <span class="chip" id="chip"><i></i><span id="chip-text">Connecting</span></span>
      <span class="final" id="final">Result</span>
      <span class="count" id="count"><b id="count-done"></b><b id="count-total">—</b> LN</span>
    </header>

    <div class="body">
      <canvas id="hist" class="hist" aria-label="Press (top) and release (bottom) hit error distributions, early left, late right"></canvas>
      <div class="reads">
        <div class="read read--press">
          <span class="label">Press</span>
          <span class="num"><b id="p-mean">—</b><small>ms</small><em id="p-dir"></em></span>
          <span class="sub">UR <b id="p-ur">—</b></span>
        </div>
        <div class="read read--release">
          <span class="label">Release</span>
          <span class="num"><b id="r-mean">—</b><small>ms</small><em id="r-dir"></em></span>
          <span class="sub">UR <b id="r-ur">—</b></span>
        </div>
      </div>
    </div>

    <div class="lanes" id="lanes">
      <canvas id="lane-canvas" class="lane-canvas" aria-label="Mean release error per column"></canvas>
      <span class="label lanes__label">Release<br>by column</span>
      <p class="lanes__note" id="lanes-note">Per-column release needs <code>ENABLE_MANIA_KEY_HIT_ERRORS</code></p>
    </div>

    <footer class="foot">
      <div class="split">
        <div class="split__row">
          <span><span class="label">Early</span> <b id="early-pct">—</b></span>
          <span class="label">Release split</span>
          <span><b id="late-pct">—</b> <span class="label">Late</span></span>
        </div>
        <div class="split__bar"><i id="early-bar"></i><i id="late-bar"></i></div>
      </div>
      <div class="great">
        <span class="label">In great <span id="great-win"></span></span>
        <span class="great__value"><b id="great-pct">—</b><small>%</small></span>
      </div>
    </footer>

    <div class="summary">
      <div><b id="s-lns">—</b><span class="label">Long notes</span></div>
      <div><b id="s-ratio">—</b><span class="label">Of objects</span></div>
      <div><span class="summary__num"><b id="s-win">—</b><small>ms</small></span><span class="label">Release great</span></div>
    </div>

    <p class="noln">No long notes on this map</p>
  </section>
</div>
<script type="module" src="overlay.js"></script>
</body>
</html>
