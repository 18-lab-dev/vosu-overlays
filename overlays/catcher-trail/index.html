<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catcher trail</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
<script type="module" src="overlay.js"></script>
</head>
<body>
<main id="root" data-view="connecting" data-orient="vertical" data-align="right" data-backing="none" aria-label="Catcher trail">
  <dl class="stats" id="stats">
    <div class="stat"><dt><i class="key"></i>Dash</dt><dd><b id="dash">—</b><span class="unit">%</span></dd></div>
    <div class="stat"><dt>Travel</dt><dd><b id="travel">—</b><span class="unit">screens</span></dd></div>
    <div class="stat"><dt>Turns</dt><dd><b id="turns">—</b><span class="unit">/min</span></dd></div>
  </dl>
  <div class="plot">
    <canvas id="trace" aria-label="Catcher position over time"></canvas>
    <ol class="ruler" aria-hidden="true"><li>0</li><li>128</li><li>256</li><li>384</li><li>512</li></ol>
    <span class="span" id="span">−6 s</span>
  </div>
  <p class="note">Catcher position needs vosu</p>
  <p class="chip" role="status"><i></i><span id="chip-text">Connecting</span></p>
</main>
</body>
</html>
