<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Results timing</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="frame" class="frame" data-orient="h" data-align="right">
  <section id="card" class="kit card" data-out aria-label="Results timing" aria-hidden="true">
    <div class="cell c-ur timing">
      <p class="kit-label">UR</p>
      <p class="kit-hero num settle"><span id="ur">—</span><span id="urFrac" class="kit-frac"></span></p>
    </div>
    <div class="cell c-mean timing">
      <p class="kit-label">Mean</p>
      <p class="kit-value num settle"><span id="mean">—</span><span class="kit-unit">ms</span></p>
    </div>
    <div class="cell c-hist timing">
      <p class="kit-label split">
        <span class="settle"><span class="early">Early</span> <b id="early">—</b><span class="kit-unit tight">%</span></span>
        <span id="onTimeCell" class="settle on-time" hidden><b id="onTime">—</b><span class="kit-unit tight">%</span> on time</span>
        <span class="settle"><b id="late">—</b><span class="kit-unit tight">%</span> <span class="late">Late</span></span>
      </p>
      <div class="hist"><canvas id="hist" aria-label="Hit error histogram, early to the left, late to the right"></canvas></div>
    </div>
    <div id="ifFc" class="cell c-fc">
      <p class="kit-label">If FC</p>
      <p class="kit-value num settle"><span id="gap">—</span><span class="kit-unit">pp</span></p>
    </div>
  </section>
  <p id="chip" class="chip kit-caption" hidden><i></i><span id="chipText">vosu offline</span></p>
</div>
<script type="module" src="overlay.js"></script>
</body>
</html>
