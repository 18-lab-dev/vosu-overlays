<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taiko pace</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="root" class="kit" data-view="status" data-layout="row" data-align="left" data-tone="idle" data-backing="scrim" data-motion="full">
  <section class="pace" role="group" aria-label="osu!taiko OK budget">
    <span class="gauge" aria-hidden="true"><i class="ghost" id="ghost"></i><i class="fill" id="fill"></i></span>
    <p class="kit-hero hero"><span class="num" id="heroNum"><span id="hero">—</span><span class="kit-frac" id="heroFrac" hidden></span></span><span class="kit-unit tight" id="heroUnit" hidden>%</span></p>
    <div class="lines">
      <p class="kit-label line"><span id="l1">OKs left for</span><span id="targetGroup"> <b id="target">99.00</b><span class="kit-unit tight">%</span></span></p>
      <p class="kit-caption line"><span id="l2a">or</span><span id="l2Group"> <b id="l2n">—</b><span class="kit-unit tight" id="l2Unit" hidden>%</span></span> <span id="l2b">misses</span></p>
      <p class="kit-label line extras" id="extras" hidden>
        <span class="x" data-hud title="Accuracy"><b id="acc">—</b><span class="kit-unit tight">%</span></span>
        <span class="x j great" data-hud title="Great"><i></i><b id="great">—</b></span>
        <span class="x j ok" data-hud title="OK"><i></i><b id="ok">—</b></span>
        <span class="x j miss" data-hud title="Miss"><i></i><b id="miss">—</b></span>
        <span class="x" id="urItem">UR <b id="ur">—</b></span>
        <span class="x" id="ppItem"><b id="pp">—</b><span class="kit-unit">pp</span> <span class="if">If FC</span> <b id="fc">—</b></span>
      </p>
    </div>
  </section>
</main>
<script type="module" src="overlay.js"></script>
</body>
</html>
