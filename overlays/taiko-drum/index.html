<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taiko drum</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="ov" class="kit kit-enter" data-out data-show="none" data-orient="horizontal" data-density="full" data-align="left" data-backing="scrim" data-motion="full" data-kps="false" aria-label="osu!taiko drum input">
  <div class="row">
    <div class="b-drum" aria-hidden="true">
      <svg class="drum-rest" viewBox="0 0 100 100"><path class="z0"/><path class="z1"/><path class="z2"/><path class="z3"/></svg>
      <svg class="drum-lit z0" viewBox="0 0 100 100"><path/></svg>
      <svg class="drum-lit z1" viewBox="0 0 100 100"><path/></svg>
      <svg class="drum-lit z2" viewBox="0 0 100 100"><path/></svg>
      <svg class="drum-lit z3" viewBox="0 0 100 100"><path/></svg>
    </div>
    <div class="b-counts">
      <span class="zc z0"><span class="kit-value" id="c0">—</span><span class="zl kit-code"></span></span>
      <span class="zc z1"><span class="kit-value" id="c1">—</span><span class="zl kit-code"></span></span>
      <span class="zc z2"><span class="kit-value" id="c2">—</span><span class="zl kit-code"></span></span>
      <span class="zc z3"><span class="kit-value" id="c3">—</span><span class="zl kit-code"></span></span>
      <span class="bal bal-l kit-value" aria-label="Left hand share of presses"><span id="bal-l">—</span><span class="kit-unit tight">%</span></span>
      <span class="track" aria-hidden="true"><i id="bal-fill"></i></span>
      <span class="bal bal-r kit-value" aria-label="Right hand share of presses"><span id="bal-r">—</span><span class="kit-unit tight">%</span></span>
    </div>
    <div class="b-alt">
      <span class="kit-label">Alternation</span>
      <span class="kit-hero"><span id="alt">—</span><span class="kit-unit tight">%</span></span>
    </div>
    <div class="b-kps">
      <span class="kit-value"><span id="kps">—</span><span class="kit-unit">kps</span></span>
      <span class="peak"><span class="kit-label">Peak</span><span class="kit-value" id="peak">—</span></span>
    </div>
  </div>
  <p class="chip" id="chip" data-tone="muted"><i class="dot" aria-hidden="true"></i><span class="kit-caption" id="chip-text">Connecting to vosu</span><span class="kit-caption chip-note">Set <code>ENABLE_KEY_OVERLAY = true</code> in vosu for drum input</span></p>
</main>
<script type="module" src="overlay.js"></script>
</body>
</html>
