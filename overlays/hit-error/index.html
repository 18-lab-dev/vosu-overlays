<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hit error · 18-LAB</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="dock" data-anchor="bottom" data-orient="h">
    <p class="chip" id="chip" data-show="0"><i></i><span id="chip-text">Connecting</span></p>
    <section class="panel" id="panel" data-show="0" aria-label="Hit error">
      <header class="head">
        <span class="label">Hit error</span>
        <span class="mode" id="mode">—</span>
        <span class="final" id="final">Final</span>
        <span class="brand" id="brand">18—LAB</span>
      </header>
      <div class="readouts" id="readouts">
        <p class="stat ur" id="ur-stat"><b id="ur">—</b><span class="label">UR</span></p>
        <p class="stat mean" id="mean-stat"><b id="mean">—</b><span class="unit">ms</span><span class="dir" id="dir"></span></p>
      </div>
      <div class="rows">
        <div class="row" id="row-main">
          <span class="meta"><span class="label" id="main-label">Press</span></span>
          <span class="end early"><span class="label">Early</span><span class="pct" id="early">—</span></span>
          <span class="range" id="range">—</span>
          <span class="end late"><span class="pct" id="late">—</span><span class="label">Late</span></span>
          <canvas aria-hidden="true"></canvas>
        </div>
        <div class="row release" id="row-release">
          <span class="meta"><span class="label">Release</span><span class="sub"><b id="rel-ur">—</b> UR</span><span class="sub"><b id="rel-mean">—</b> ms</span></span>
          <span class="end early" aria-hidden="true">&nbsp;</span>
          <span class="end late" aria-hidden="true">&nbsp;</span>
          <canvas aria-hidden="true"></canvas>
          <span class="missing">Release split needs vosu</span>
        </div>
      </div>
    </section>
  </div>
</div>
<script type="module" src="overlay.js"></script>
</body>
</html>
