<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taiko drum</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="ov" data-show="none" data-orient="horizontal" data-density="full" data-align="left" data-colour="don-kat" data-backing="none" data-stats="true" aria-label="osu!taiko drum input">
  <div class="row" id="row">
    <div class="block b-drum"><canvas id="drum-canvas" aria-hidden="true"></canvas></div>
    <div class="block b-counts">
      <div class="zc"><span class="label">Kat</span><b class="num-l" id="c0">—</b><i class="zt zt-0"></i></div>
      <div class="zc"><span class="label">Don</span><b class="num-l" id="c1">—</b><i class="zt zt-1"></i></div>
      <div class="zc"><span class="label">Don</span><b class="num-l" id="c2">—</b><i class="zt zt-2"></i></div>
      <div class="zc"><span class="label">Kat</span><b class="num-l" id="c3">—</b><i class="zt zt-3"></i></div>
    </div>
    <div class="block stat b-kps"><span class="label">KPS</span><b class="num-xl" id="kps">—</b></div>
    <div class="block stat b-peak"><span class="label">Peak</span><b class="num-l tint" id="peak">—</b></div>
    <div class="block b-hands">
      <span class="label">Hands</span>
      <div class="hands-row">
        <span class="side"><span class="hand">L</span><span class="pct" id="bal-l">—</span></span>
        <div class="track"><i class="fill" id="bal-fill"></i><i class="mid"></i></div>
        <span class="side"><span class="pct" id="bal-r">—</span><span class="hand">R</span></span>
      </div>
    </div>
    <div class="block b-seq">
      <span class="seq-hands" aria-hidden="true"><span>L</span><span>R</span></span>
      <canvas id="seq-canvas" aria-label="Recent hits by hand, newest right"></canvas>
    </div>
    <div class="block stat b-alt"><span class="label">Alternation</span><span class="label short">Alt</span><b class="num-l" id="alt">—</b></div>
    <div class="block stat b-rep"><span class="label">Same hand</span><span class="label short">Same</span><b class="num-l" id="rep">—</b></div>
  </div>
  <p class="chip" id="chip" data-tone="muted"><i class="dot" aria-hidden="true"></i><span id="chip-text">Connecting to vosu</span><span class="chip-note">Set <code>ENABLE_KEY_OVERLAY = true</code> in vosu for drum input</span></p>
</main>
<script type="module" src="overlay.js"></script>
</body>
</html>
