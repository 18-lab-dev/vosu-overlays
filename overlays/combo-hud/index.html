<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Combo HUD · 18-LAB</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="stage" data-anchor="bottom-left">
  <section id="hud" class="hud" data-layout="stack" aria-label="Gameplay HUD">
    <header class="hud__head">
      <span class="brand" id="brand">18—LAB</span>
      <span class="head__mode" id="mode"></span>
      <span class="head__tag" id="source" hidden></span>
      <span class="head__tag head__tag--results" id="results-tag" hidden>Results</span>
    </header>
    <div class="cell cell--combo" id="combo-cell">
      <div class="cell__top">
        <span class="labels"><span class="label label--main" id="combo-label">Combo</span><span class="label label--break" id="break-label" aria-hidden="true">Break</span></span>
        <span class="label peak" id="peak"><span id="peak-label">Peak</span> <b id="peak-value">—</b></span>
      </div>
      <div class="combo">
        <span class="combo__value" id="combo"><span id="combo-num">—</span><span class="combo__unit">×</span></span>
        <span class="combo__ghost" id="ghost" aria-hidden="true"><span id="ghost-num"></span><span class="combo__unit">×</span></span>
      </div>
      <div class="rail" id="rail" aria-hidden="true"><i class="rail__fill" id="rail-fill"></i><i class="rail__peak" id="rail-peak"></i><i class="rail__break" id="rail-break"></i></div>
    </div>
    <div class="cell cell--acc" id="acc-cell">
      <div class="cell__top"><span class="label">Accuracy</span></div>
      <div class="readout"><span id="acc">—</span><span class="readout__unit" id="acc-unit">%</span><span class="rank" id="rank" hidden></span></div>
    </div>
    <div class="cell cell--score" id="score-cell">
      <div class="cell__top"><span class="label">Score</span></div>
      <div class="readout"><span class="score__lead" id="score-lead"></span><span id="score">—</span></div>
    </div>
    <div class="cell cell--hp" id="hp-cell">
      <span class="label">HP</span>
      <span class="meter"><i class="meter__fill" id="hp-fill"></i></span>
      <span class="hp__value" id="hp">—</span>
    </div>
    <div class="cell cell--prog" id="prog-cell">
      <canvas class="ring" id="ring" aria-hidden="true"></canvas>
      <span class="prog__time" id="time">—</span>
    </div>
  </section>
  <div class="status" id="status" data-state="connecting" role="status"><i></i><span id="status-text">Connecting to vosu</span></div>
</main>
<script type="module" src="overlay.js"></script>
</body>
</html>
